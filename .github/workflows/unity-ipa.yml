name: unity-ipa

# Compiles the CardboardXR iOS Xcode project (exported from Windows Unity via
# unity/CardboardXR/Tools/ios_build_and_run.sh, zipped and released here) into
# an unsigned .ipa on macOS. Workflow dispatch — triggers manually after a new
# unity-export asset lands.
on:
  workflow_dispatch:
    inputs:
      export_url:
        description: "URL of the unity-xcode-export.zip release asset (optional; latest unity-export release used if omitted)"
        required: false

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Find export asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="unity-export"
          URL="${{ github.event.inputs.export_url }}"
          if [ -z "$URL" ]; then
            ASSET_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG \
              --jq '.assets[] | select(.name=="unity-xcode-export.zip") | .id' 2>/dev/null || true)
            if [ -z "$ASSET_ID" ]; then echo "no unity-xcode-export.zip asset on tag unity-export"; exit 1; fi
            URL="https://github.com/${{ github.repository }}/releases/download/$TAG/unity-xcode-export.zip"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download Xcode export
        run: |
          curl -sL -o unity-xcode-export.zip "${{ steps.asset.outputs.url }}"
          unzip -q unity-xcode-export.zip -d unity-export
          ls unity-export/iOS/Unity-iPhone.xcodeproj >/dev/null && echo "xcode project found"

      - name: Compile iios native layer
        run: |
          # Unity's generated pbxproj has a baked-in file list, so the injected
          # IiosNative.mm isn't compiled by the project itself. Build it as a
          # static lib and force_load it at link time via OTHER_LDFLAGS.
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -c -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -I unity-export/iOS/Classes \
            -I windows/host-bridge \
            unity-export/iOS/Classes/iios/IiosNative.mm \
            -o unity-export/iOS/Classes/iios/libiiosnative.a
          ls -la unity-export/iOS/Classes/iios/

      - name: Build archive (unsigned)
        run: |
          xcodebuild \
            -project unity-export/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iOS.xcarchive \
            archive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            OTHER_LDFLAGS='-force_load $(SRCROOT)/Classes/iios/libiiosnative.a $(BUILT_PRODUCTS_DIR)/il2cpp.a'

      - name: Debug link failure
        if: failure()
        run: |
          MAP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*UnityFramework-LinkMap*" 2>/dev/null | head -1)
          if [ -n "$MAP" ]; then
            echo "== libraries loaded per link map =="
            grep -oE '\[[0-9]+\][^ ]*\.(a|framework)[^ ]*' "$MAP" | sort -u | head -20
            echo "== archive candidates on disk =="
            find "$HOME/Library/Developer/Xcode/DerivedData" \( -name "libGameAssembly.a" -o -name "il2cpp.a" \) -exec ls -la {} \; -exec sh -c 'nm -g "$1" 2>/dev/null | grep -c "_il2cpp_array_new" || echo 0' _ {} \;
          fi
          echo "== GameAssembly targets in project =="
          xcodebuild -project unity-export/iOS/Unity-iPhone.xcodeproj -list

      - name: Package unsigned .ipa
        run: |
          APP=$(find build -path '*Build/Products/Release-iphoneos/*.app' | head -1)
          echo "Found app bundle: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry cardboardxr-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardboardxr-unsigned-ipa
          path: cardboardxr-unsigned.ipa
          retention-days: 30

      # Rolling "cardboardxr" release: latest CardboardXR+iios export.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cardboardxr"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" cardboardxr-unsigned.ipa \
            --title "CardboardXR + iios export ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --notes "CardboardXR (brenpoly/CardboardXR @ unity/CardboardXR) iOS Xcode export,
            compiled unsigned on macOS. SteamVR/FEX/Wine/DXMT layer per docs/UNITY-STEAMVR.md.
            Sign + sideload per docs/SIDELOADING.md." \
            --prerelease
