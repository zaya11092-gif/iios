name: build-ipa

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write   # publish the .ipa to the rolling dev-build release
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Debug uses singlefile compilation, which always prints full per-file
      # diagnostics; Release/WMO can swallow error text entirely. This step
      # gives readable compile errors before the archive step runs.
      - name: Compile check (Debug)
        run: |
          xcodebuild \
            -project iios.xcodeproj \
            -scheme iios \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      # Xcode 16.4's Swift performance inliner crashes (-O WMO) on this code
      # (SILPerformanceInliner/getFieldIndex segfault). -Osize + singlefile
      # takes a different optimizer path and produces the archive.
      - name: Build archive (unsigned)
        run: |
          xcodebuild \
            -project iios.xcodeproj \
            -scheme iios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iios.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            SWIFT_OPTIMIZATION_LEVEL='-Osize' \
            SWIFT_COMPILATION_MODE=singlefile

      - name: Package unsigned .ipa
        run: |
          APP=$(find build -path '*.xcarchive/Products/Applications/*.app' | head -1)
          echo "Found app bundle: $APP"
          test -n "$APP" || { echo "No .app found in archive"; exit 1; }
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry iios-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iios-unsigned-ipa
          path: iios-unsigned.ipa
          retention-days: 30

      # Rolling "dev-build" release: every green build replaces it, so
      # https://github.com/<owner>/iios/releases/tag/dev-build always has the
      # newest sideloadable .ipa.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-build"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" iios-unsigned.ipa \
            --title "Dev build (${{ github.sha }})" \
            --notes "Unsigned .ipa from commit ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M UTC').

Sign and sideload per docs/SIDELOADING.md." \
            --prerelease
